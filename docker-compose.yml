services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_ENV: "jazzy"
        UID: ${UID}
        GID: ${GID}
    image: beluga_ros2
    tty: true         # Enable TTY allocation
    stdin_open: true  # Keep stdin open for interactive input
    environment:
      - QT_QPA_PLATFORM=wayland
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
    user: "${UID}:${GID}"
    volumes:
      - ./beluga_ws:/home/user/beluga_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/user/1000/wayland-0:/run/user/1000/wayland-0
      - /dev/dri:/dev/dri
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/wayland-sock
      - ${XDG_RUNTIME_DIR}:${XDG_RUNTIME_DIR}
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
